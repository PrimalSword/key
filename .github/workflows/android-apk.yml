name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/KementPrintCam-0.3.0-lab.apk
          sha256sum dist/KementPrintCam-0.3.0-lab.apk | tee dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KementPrintCam-0.3.0-lab
          path: |
            dist/KementPrintCam-0.3.0-lab.apk
            dist/SHA256SUMS.txt

      - name: Publish installable Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0-lab
          name: Kement Print Cam 0.3 lab
          prerelease: true
          make_latest: true
          generate_release_notes: false
          overwrite_files: true
          body: |
            APK instalável de laboratório para a EKEN-Z26/Kement do proprietário.

            Requisito desta versão: mantenha o aplicativo oficial Kement (`com.eken.kement`) instalado no mesmo celular. O Print Cam reutiliza em runtime as bibliotecas VCTP2P da instalação oficial e não as redistribui.

            A 0.3 adiciona fallback por `devices-state`: se o botão físico acordar a campainha mas o `preview-start` não chegar ao nosso socket, o app detecta o SN online, envia `stream-start` e inicia as tentativas P2P.
          files: |
            dist/KementPrintCam-0.3.0-lab.apk
            dist/SHA256SUMS.txt
