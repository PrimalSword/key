name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n1)
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/KementPrintCam-${VERSION}.apk"
          sha256sum "dist/KementPrintCam-${VERSION}.apk" | tee dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KementPrintCam-${{ env.VERSION }}
          path: |
            dist/KementPrintCam-${{ env.VERSION }}.apk
            dist/SHA256SUMS.txt

      - name: Publish installable Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Kement Print Cam ${{ env.VERSION }}
          prerelease: true
          make_latest: true
          generate_release_notes: false
          overwrite_files: true
          body: |
            APK instalável de laboratório para a EKEN-Z26/Kement do proprietário.

            Mantenha o aplicativo oficial Kement (`com.eken.kement`) instalado no mesmo celular. O Print Cam reutiliza em runtime as bibliotecas nativas da instalação oficial e não as redistribui.

            Esta versão replica o caminho AES do Kement 2.3.2 (`decryptAESData(payload, pk, aux)`) e controla as tentativas P2P em fila única para evitar tempestade de `stream-start`/`connectToPeer`.
          files: |
            dist/KementPrintCam-${{ env.VERSION }}.apk
            dist/SHA256SUMS.txt
