import java.util.zip.GZIPInputStream

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kement.printcam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kement.printcam'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-lab'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def nativeSourceDir = file("$rootDir/native-gz")
def nativeOutputDir = file("$projectDir/src/main/jniLibs/arm64-v8a")

tasks.register('restoreNativeLibs') {
    inputs.files(
            file("$nativeSourceDir/libVCTP2P.so.gz"),
            file("$nativeSourceDir/libc++_shared.so.gz")
    )
    outputs.files(
            file("$nativeOutputDir/libVCTP2P.so"),
            file("$nativeOutputDir/libc++_shared.so")
    )

    doLast {
        nativeOutputDir.mkdirs()
        ['libVCTP2P.so', 'libc++_shared.so'].each { name ->
            def source = file("$nativeSourceDir/${name}.gz")
            def target = file("$nativeOutputDir/$name")
            source.withInputStream { raw ->
                GZIPInputStream gzip = new GZIPInputStream(raw)
                target.withOutputStream { out -> gzip.transferTo(out) }
                gzip.close()
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('restoreNativeLibs')
}
