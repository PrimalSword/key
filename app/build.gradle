plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kement.printcam'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kement.printcam'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0-lab'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
